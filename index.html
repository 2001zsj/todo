<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<meta name="apple-mobile-web-app-title" content="魔法待办">
<meta name="apple-mobile-web-app-status-bar-style" content="pink-translucent">
<meta name="theme-color" content="#ff6b9d">
<title>✨ 魔法待办</title>
<style>
  :root {
    --pink: #ff6b9d;
    --pink-light: #ffb8d0;
    --purple: #c471ed;
    --purple-light: #e8b4f8;
    --blue: #64b5f6;
    --bg: #fff5f9;
    --card: rgba(255,255,255,0.88);
    --text: #4a3055;
    --text2: #9b7ea8;
    --border: #f0d5e8;
    --shadow: 0 4px 20px rgba(180,130,160,0.13);
    --radius: 16px;
    --safe-bottom: env(safe-area-inset-bottom, 12px);
    /* 复合渐变变量 */
    --grad-body: linear-gradient(170deg, #fff5f9 0%, #f8e8ff 35%, #eef3ff 65%, #fff0f5 100%);
    --grad-title: linear-gradient(135deg, #ff6b9d, #c471ed, #64b5f6);
    --grad-btn: linear-gradient(135deg, #ff6b9d, #c471ed);
    --grad-filter: linear-gradient(135deg, #ff6b9d, #c471ed);
    --grad-checkbox: linear-gradient(135deg, #ff6b9d, #c471ed);
    --grad-count: linear-gradient(135deg, #ffe0ec, #f0d8ff);
    --grad-banner: linear-gradient(135deg, #4a3055, #3d2855);
    --grad-install-btn: linear-gradient(135deg, #ff6b9d, #c471ed);
    --swipe-bg: linear-gradient(135deg, #ff6b6b, #ff4444);
    --chibi-bar-bg: linear-gradient(to bottom, rgba(255,245,249,0.95) 60%, rgba(255,245,249,0) 100%);
    --clear-btn-border: #ffccd8;
    --clear-btn-color: #ff6b9d;
    --checkbox-border: #e8c8d8;
    --completed-text: #8b6e90;
    --time-text: #a080a8;
    --placeholder: #ccb8d8;
    --petal-bg: radial-gradient(circle at 30% 30%, #ffb8d0, #ff85a8);
    --skin: #ffe0d0;
  }

  /* ── 主题：星月夜 ── */
  body.theme-starry {
    --pink: #818cf8; --pink-light: #c7d2fe; --purple: #a78bfa; --purple-light: #ddd6fe; --blue: #67e8f9;
    --bg: #f5f3ff; --card: rgba(255,255,255,0.85); --text: #1e1b4b; --text2: #7c6fa0;
    --border: #d4c8f0; --shadow: 0 4px 20px rgba(100,90,160,0.12);
    --grad-body: linear-gradient(170deg, #f5f3ff 0%, #ede9fe 35%, #e0e7ff 65%, #f0f4ff 100%);
    --grad-title: linear-gradient(135deg, #818cf8, #a78bfa, #67e8f9);
    --grad-btn: linear-gradient(135deg, #6366f1, #8b5cf6);
    --grad-filter: linear-gradient(135deg, #6366f1, #8b5cf6);
    --grad-checkbox: linear-gradient(135deg, #6366f1, #8b5cf6);
    --grad-count: linear-gradient(135deg, #e0e7ff, #ddd6fe);
    --grad-banner: linear-gradient(135deg, #1e1b4b, #2e1065);
    --grad-install-btn: linear-gradient(135deg, #6366f1, #8b5cf6);
    --swipe-bg: linear-gradient(135deg, #f87171, #ef4444);
    --chibi-bar-bg: linear-gradient(to bottom, rgba(245,243,255,0.95) 60%, rgba(245,243,255,0) 100%);
    --clear-btn-border: #c7d2fe; --clear-btn-color: #6366f1;
    --checkbox-border: #c4b5e0; --completed-text: #7a6a96; --time-text: #9888b0; --placeholder: #b8b0d0;
    --petal-bg: radial-gradient(circle at 30% 30%, #c7d2fe, #818cf8);
  }

  /* ── 主题：森林物语 ── */
  body.theme-forest {
    --pink: #10b981; --pink-light: #a7f3d0; --purple: #34d399; --purple-light: #d1fae5; --blue: #06b6d4;
    --bg: #f0fdf4; --card: rgba(255,255,255,0.85); --text: #064e3b; --text2: #6b8b7e;
    --border: #c6f0d8; --shadow: 0 4px 20px rgba(80,150,110,0.12);
    --grad-body: linear-gradient(170deg, #f0fdf4 0%, #ecfdf5 35%, #ecfeff 65%, #f0fdfa 100%);
    --grad-title: linear-gradient(135deg, #10b981, #34d399, #06b6d4);
    --grad-btn: linear-gradient(135deg, #059669, #10b981);
    --grad-filter: linear-gradient(135deg, #059669, #10b981);
    --grad-checkbox: linear-gradient(135deg, #059669, #10b981);
    --grad-count: linear-gradient(135deg, #d1fae5, #a7f3d0);
    --grad-banner: linear-gradient(135deg, #064e3b, #022c22);
    --grad-install-btn: linear-gradient(135deg, #059669, #10b981);
    --swipe-bg: linear-gradient(135deg, #f87171, #ef4444);
    --chibi-bar-bg: linear-gradient(to bottom, rgba(240,253,244,0.95) 60%, rgba(240,253,244,0) 100%);
    --clear-btn-border: #a7f3d0; --clear-btn-color: #059669;
    --checkbox-border: #b7e4cf; --completed-text: #5a8a72; --time-text: #7aaa92; --placeholder: #a0c0b0;
    --petal-bg: radial-gradient(circle at 30% 30%, #a7f3d0, #34d399);
  }

  /* ── 主题：暗夜 ── */
  body.theme-dark {
    --pink: #f59e0b; --pink-light: #fcd34d; --purple: #8b5cf6; --purple-light: #c4b5fd; --blue: #67e8f9;
    --bg: #0f172a; --card: rgba(30,41,59,0.92); --text: #f1f5f9; --text2: #cbd5e1;
    --border: #334155; --shadow: 0 4px 24px rgba(0,0,0,0.5);
    --grad-body: linear-gradient(170deg, #0f172a 0%, #1e1b4b 40%, #0f172a 70%, #1a1a2e 100%);
    --grad-title: linear-gradient(135deg, #f59e0b, #fbbf24, #eab308);
    --grad-btn: linear-gradient(135deg, #8b5cf6, #6366f1);
    --grad-filter: linear-gradient(135deg, #8b5cf6, #6366f1);
    --grad-checkbox: linear-gradient(135deg, #8b5cf6, #6366f1);
    --grad-count: linear-gradient(135deg, #1e293b, #334155);
    --grad-banner: linear-gradient(135deg, #1e1b4b, #2e1065);
    --grad-install-btn: linear-gradient(135deg, #8b5cf6, #6366f1);
    --swipe-bg: linear-gradient(135deg, #ef4444, #dc2626);
    --chibi-bar-bg: linear-gradient(to bottom, rgba(15,23,42,0.95) 60%, rgba(15,23,42,0) 100%);
    --clear-btn-border: #fcd34d; --clear-btn-color: #facc15;
    --checkbox-border: #556477; --completed-text: #b0bdd0; --time-text: #cbd5e1; --placeholder: #94a3b8;
    --petal-bg: radial-gradient(circle at 30% 30%, #fcd34d, #f59e0b);
    --skin: #ffe0d0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--grad-body);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ══════════════════════════════════════
     Background decorations
     ══════════════════════════════════════ */
  .bg-deco {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .sparkle {
    position: absolute;
    animation: sparkleFloat 3.5s ease-in-out infinite;
    font-size: 1rem;
    opacity: 0.45;
  }
  .sparkle:nth-child(1)  { top: 4%;  left: 8%;  animation-delay: 0s;    animation-duration: 3.2s; }
  .sparkle:nth-child(2)  { top: 8%;  left: 88%; animation-delay: 0.7s;  animation-duration: 2.8s; }
  .sparkle:nth-child(3)  { top: 25%; left: 5%;  animation-delay: 1.3s;  animation-duration: 3.6s; }
  .sparkle:nth-child(4)  { top: 30%; left: 92%; animation-delay: 1.9s;  animation-duration: 3.0s; }
  .sparkle:nth-child(5)  { top: 55%; left: 6%;  animation-delay: 2.5s;  animation-duration: 3.3s; }
  .sparkle:nth-child(6)  { top: 50%; left: 91%; animation-delay: 0.4s;  animation-duration: 2.9s; }
  .sparkle:nth-child(7)  { top: 72%; left: 10%; animation-delay: 1.6s;  animation-duration: 3.7s; }
  .sparkle:nth-child(8)  { top: 68%; left: 87%; animation-delay: 2.2s;  animation-duration: 3.1s; }

  @keyframes sparkleFloat {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
    50%      { transform: translateY(-14px) scale(1.3); opacity: 0.75; }
  }

  .petal {
    position: absolute;
    width: 10px; height: 10px;
    background: radial-gradient(circle at 30% 30%, #ffb8d0, #ff85a8);
    border-radius: 50% 0 50% 0;
    animation: petalFall linear infinite;
    opacity: 0;
  }
  .petal:nth-child(9)  { left: 10%; animation-duration: 9s;  animation-delay: 0s;  }
  .petal:nth-child(10) { left: 28%; animation-duration: 11s; animation-delay: 2.5s; }
  .petal:nth-child(11) { left: 72%; animation-duration: 10s; animation-delay: 4.5s; }
  .petal:nth-child(12) { left: 88%; animation-duration: 12s; animation-delay: 1.5s; }
  .petal:nth-child(13) { left: 45%; animation-duration: 8.5s; animation-delay: 3.5s; }
  .petal:nth-child(14) { left: 58%; animation-duration: 10.5s;animation-delay: 5.5s; }

  @keyframes petalFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.5; }
    92%  { opacity: 0.5; }
    100% { transform: translateY(105vh) rotate(600deg); opacity: 0; }
  }

  /* ── 星空特效（暗夜主题专属）── */
  .starfield { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star-dot { position: absolute; background: #fff; border-radius: 50%; animation: twinkle calc(2s + var(--sd,0s)) ease-in-out infinite; animation-delay: var(--sdl,0s); opacity: 0.15; }
  @keyframes twinkle { 0%,100%{opacity:0.15;transform:scale(1)} 50%{opacity:1;transform:scale(1.8)} }
  .moon-glow { position: fixed; top: 6%; right: 10%; font-size: 2.2rem; pointer-events: none; z-index: 0; animation: moonPulse 4s ease-in-out infinite; opacity: 0.5; }
  @keyframes moonPulse { 0%,100%{filter:drop-shadow(0 0 6px rgba(251,191,36,0.3))} 50%{filter:drop-shadow(0 0 18px rgba(251,191,36,0.8))} }
  .shooting { position: absolute; width: 60px; height: 1.5px; background: linear-gradient(90deg,transparent,#fcd34d); border-radius: 2px; animation: shoot calc(2s + var(--sd,0s)) linear infinite; animation-delay: var(--sdl,0s); opacity: 0; }
  @keyframes shoot { 0%{transform:translateX(-60px) translateY(0);opacity:0} 15%{opacity:0.8} 30%{opacity:0;transform:translateX(180px) translateY(-25px)} 100%{opacity:0;transform:translateX(180px) translateY(-25px)} }

  /* ══════════════════════════════════════
     Chibi characters — top bar style for mobile
     ══════════════════════════════════════ */
  .chibi-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 58px;
    z-index: 10;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 6px 14px 0;
    background: linear-gradient(to bottom, rgba(255,245,249,0.95) 60%, rgba(255,245,249,0) 100%);
  }

  .chibi-mini {
    animation: chibiWave 3s ease-in-out infinite;
  }
  .chibi-mini:last-child { animation-delay: 0.8s; }

  @keyframes chibiWave {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  /* ══════════════════════════════════════
     Main App
     ══════════════════════════════════════ */
  .app {
    width: 100%;
    max-width: 460px;
    padding: 50px 16px 80px;
    padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .header .mascot {
    font-size: 2.4rem;
    display: block;
    animation: mascotBounce 2s ease-in-out infinite;
    line-height: 1;
  }

  @keyframes mascotBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    30%      { transform: translateY(-8px) scale(1.06); }
    50%      { transform: translateY(0) scale(1); }
    70%      { transform: translateY(-4px) scale(1.03); }
  }

  .header h1 {
    font-size: 1.4rem;
    font-weight: 800;
    background: var(--grad-title);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleShine 3s ease-in-out infinite;
    letter-spacing: 2px;
    margin-top: -4px;
  }

  @keyframes titleShine {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .header .date {
    font-size: 0.75rem;
    color: var(--text2);
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  /* ── Input ── */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .input-row input {
    flex: 1;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.92rem;
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text);
    outline: none;
    transition: 0.2s ease;
    min-width: 0;
    height: 48px;
  }

  .input-row input:focus {
    border-color: #c471ed;
    box-shadow: 0 0 0 4px rgba(196,113,237,0.1);
  }

  .input-row input::placeholder { color: var(--placeholder); }

  .input-row button {
    padding: 0 20px;
    height: 48px;
    background: var(--grad-btn);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s ease;
    white-space: nowrap;
    box-shadow: 0 3px 12px rgba(196,113,237,0.3);
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .input-row button:active {
    transform: scale(0.94);
    box-shadow: 0 2px 8px rgba(196,113,237,0.2);
  }

  /* ── Filters ── */
  .filters {
    display: flex;
    gap: 5px;
    margin-bottom: 12px;
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: var(--radius);
    padding: 5px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .filters button {
    flex: 1;
    height: 40px; padding: 0 4px;
    border: none;
    border-radius: 13px;
    background: transparent;
    color: var(--text2);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
    white-space: nowrap;
  }

  .filters button.active {
    background: var(--grad-filter);
    color: #fff;
    box-shadow: 0 2px 10px rgba(196,113,237,0.25);
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.75rem;
    padding: 0 6px;
  }

  .stats-bar .count {
    background: var(--grad-count);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 600;
    color: var(--purple);
    font-size: 0.73rem;
  }

  .stats-bar button {
    background: none;
    border: 1px solid var(--clear-btn-border);
    color: var(--clear-btn-color);
    cursor: pointer;
    font-size: 0.73rem;
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: 600;
    transition: 0.2s ease;
  }

  .stats-bar button:active { background: #fff0f5; }

  /* ── Todo List ── */
  .todo-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 14px;
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid transparent;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .todo-item:active {
    transform: scale(0.985);
    border-color: #f0d5e8;
  }

  .todo-item.completed {
    opacity: 0.5;
    background: rgba(255,255,255,0.45);
  }

  /* swipe delete indicator */
  .todo-item .swipe-bg {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 0;
    background: linear-gradient(135deg, #ff6b6b, #ff4444);
    border-radius: var(--radius);
    transition: width 0.15s ease;
    display: none;
    align-items: center;
    justify-content: flex-end;
    padding-right: 0;
    color: #fff;
    font-size: 1.1rem;
    overflow: hidden;
    z-index: 0;
  }

  .todo-item .swipe-bg.show {
    display: flex;
    width: 70px;
    padding-right: 16px;
  }

  .todo-item > *:not(.swipe-bg) {
    position: relative;
    z-index: 1;
  }

  /* checkbox */
  .checkbox {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border: 2.5px solid var(--checkbox-border);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }

  .todo-item.completed .checkbox {
    background: var(--grad-checkbox);
    border-color: transparent;
  }

  .checkbox::after {
    content: '';
    display: none;
    width: 5px; height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translateY(-1px);
  }

  .todo-item.completed .checkbox::after { display: block; }

  /* text */
  .todo-text {
    flex: 1;
    font-size: 0.9rem;
    word-break: break-all;
    line-height: 1.4;
    min-width: 0;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: var(--completed-text);
  }

  .todo-time {
    display: block;
    font-size: 0.7rem;
    color: var(--time-text);
    margin-top: 3px;
    font-weight: 500;
  }

  /* edit input */
  .edit-input {
    flex: 1;
    padding: 7px 10px;
    border: 2px solid #c471ed;
    border-radius: 10px;
    font-size: 0.9rem;
    outline: none;
    background: rgba(255,255,255,0.9);
    color: var(--text);
    box-shadow: 0 0 0 3px rgba(196,113,237,0.08);
    min-width: 0;
  }

  /* delete btn */
  .btn-delete {
    width: 34px; height: 34px;
    border: none;
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
    font-size: 1.1rem;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s ease;
    opacity: 0.5;
  }

  .todo-item:active .btn-delete,
  .btn-delete.show { opacity: 1; }

  /* ── Empty state ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    color: var(--text2);
  }

  .empty-state .icon {
    font-size: 4rem;
    margin-bottom: 14px;
    animation: emptyFloat 3s ease-in-out infinite;
  }

  @keyframes emptyFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .empty-state .msg {
    font-size: 0.9rem;
    line-height: 1.6;
  }

  /* ── Animation ── */
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .todo-item { animation: slideIn 0.28s ease; }

  /* completed bounce */
  @keyframes popIn {
    0%   { transform: scale(1); }
    40%  { transform: scale(0.92); }
    70%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .todo-item.popping { animation: popIn 0.3s ease; }

  /* ── Footer ── */
  .footer {
    text-align: center;
    margin-top: auto;
    padding: 14px 0 8px;
    font-size: 0.7rem;
    color: var(--text2);
    opacity: 0.6;
  }

  .footer .heart {
    display: inline-block;
    animation: heartBeat 1.2s ease-in-out infinite;
    color: var(--pink);
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.2); }
    30%      { transform: scale(1); }
  }

  /* ══════════════════════════════════════
     Toast
     ══════════════════════════════════════ */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(74,48,85,0.9);
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 0.8rem;
    z-index: 99;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ══════════════════════════════════════
     Larger screens — show bigger chibis
     ══════════════════════════════════════ */
  @media (min-width: 700px) {
    .chibi-bar { display: none; }

    .chibi-side {
      position: fixed;
      bottom: 30px;
      z-index: 1;
      pointer-events: none;
    }
    .chibi-side.left  { left: max(8px, calc(50% - 320px)); }
    .chibi-side.right { right: max(8px, calc(50% - 320px)); }
    .chibi-side .chibi-bounce { animation: chibiSideBounce 4s ease-in-out infinite; }
    .chibi-side.right .chibi-bounce { animation-delay: 1s; }

    @keyframes chibiSideBounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
  }

  @media (max-width: 699px) {
    .chibi-side { display: none; }
  }

  /* ══════════════════════════════════════
     Install banner
     ══════════════════════════════════════ */
  .install-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--grad-banner);
    color: #fff;
    border-radius: var(--radius);
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(60,30,70,0.25);
    position: relative;
    overflow: hidden;
    animation: bannerSlide 0.4s ease;
  }
  .install-banner.hidden { display: none; }

  @keyframes bannerSlide {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .install-banner::before {
    content: '';
    position: absolute;
    top: -20px; right: -20px;
    width: 60px; height: 60px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }

  .install-banner .banner-icon {
    font-size: 1.5rem;
    flex-shrink: 0;
    animation: mascotBounce 2s ease-in-out infinite;
  }

  .install-banner .banner-text {
    flex: 1;
    font-size: 0.78rem;
    line-height: 1.4;
  }
  .install-banner .banner-text strong { color: var(--pink-light); }

  .install-banner .banner-btn {
    padding: 8px 14px;
    background: var(--grad-install-btn);
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .install-banner .banner-btn:active { transform: scale(0.94); }

  .install-banner .banner-close {
    position: absolute;
    top: 4px; right: 8px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 1rem;
    cursor: pointer;
    padding: 2px 6px;
  }

  /* ══════════════════════════════════════
     Theme toggle — bottom bar
     ══════════════════════════════════════ */
  .theme-switch {
    position: fixed;
    bottom: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    z-index: 99;
    display: flex;
    gap: 4px;
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 26px;
    padding: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    border: 1.5px solid var(--border);
    max-width: calc(100vw - 24px);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .theme-switch button {
    height: 34px;
    min-width: 34px;
    padding: 0 12px;
    border-radius: 22px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.25s ease;
    font-size: 0.78rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 3px;
    background: transparent;
    color: var(--text2);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .theme-switch button .label { display: inline; }
  .theme-switch button.active {
    background: var(--grad-btn);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 12px rgba(196,113,237,0.3);
  }
  .theme-switch button:active { transform: scale(0.94); }

  /* 手机窄屏：只显示 emoji，隐藏文字 */
  @media (max-width: 400px) {
    .theme-switch button { padding: 0 8px; min-width: 36px; justify-content: center; }
    .theme-switch button .label { display: none; }
  }

  /* ══════════════════════════════════════
     Theme overrides for hardcoded values
     ══════════════════════════════════════ */

  /* --- 星月夜 --- */
  body.theme-starry .filter-btn .active,
  body.theme-starry .filters button.active { background: var(--grad-filter); color: #fff; }

  body.theme-starry .todo-item.completed .checkbox { background: var(--grad-checkbox); }

  body.theme-starry .input-row button { box-shadow: 0 3px 12px rgba(99,102,241,0.3); }

  body.theme-starry .todo-item:hover { border-color: #d4c8f0; box-shadow: 0 8px 28px rgba(100,90,160,0.18); }

  /* --- 森林物语 --- */
  body.theme-forest .filters button.active { background: var(--grad-filter); color: #fff; }

  body.theme-forest .todo-item.completed .checkbox { background: var(--grad-checkbox); }

  body.theme-forest .stats-bar .count { background: var(--grad-count); color: #059669; }

  body.theme-forest .install-banner { background: var(--grad-banner); }

  body.theme-forest .install-banner .banner-btn { background: var(--grad-install-btn); }

  body.theme-forest .chibi-bar { background: var(--chibi-bar-bg); }

  body.theme-forest .checkbox { border-color: var(--checkbox-border); }

  body.theme-forest .petal { background: var(--petal-bg); }

  body.theme-forest .sparkle { filter: hue-rotate(200deg) saturate(0.9); }

  body.theme-forest .input-row input:focus { border-color: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,0.12); }

  body.theme-forest .input-row button { box-shadow: 0 3px 12px rgba(5,150,105,0.3); }

  body.theme-forest .filters button:hover::after { background: linear-gradient(90deg, #10b981, #34d399); }

  body.theme-forest .todo-item:hover { border-color: #c6f0d8; box-shadow: 0 8px 28px rgba(80,150,110,0.15); }

  /* --- 暗夜 --- */

  body.theme-dark .todo-item.completed .checkbox { background: var(--grad-checkbox); }
  body.theme-dark .stats-bar .count { background: var(--grad-count); color: #f59e0b; }
  body.theme-dark .install-banner { background: var(--grad-banner); }
  body.theme-dark .install-banner .banner-btn { background: var(--grad-install-btn); }
  body.theme-dark .chibi-bar { background: var(--chibi-bar-bg); }

  body.theme-dark .todo-item.completed .todo-text { color: var(--completed-text); }
  body.theme-dark .petal { background: var(--petal-bg); }
  body.theme-dark .sparkle { filter: brightness(1.5); }

  body.theme-dark .input-row button { box-shadow: 0 3px 12px rgba(139,92,246,0.3); }
  body.theme-dark .filters button:hover::after { background: linear-gradient(90deg, #f59e0b, #8b5cf6); }
  body.theme-dark .todo-item:hover { border-color: #475569; box-shadow: 0 8px 28px rgba(0,0,0,0.3); }

  body.theme-dark .install-banner .banner-text strong { color: #fcd34d; }
  body.theme-dark .toast { background: rgba(30,27,75,0.95); color: #fcd34d; border-color: rgba(245,158,11,0.2); }

  .star-dot { opacity: 0.06; transition: opacity 0.4s; }

<!-- ══════════════════════════════════════
     Toast
     ══════════════════════════════════════ -->
<div class="toast" id="toast"></div>

<!-- ══════════════════════════════════════
     Theme switch
     ══════════════════════════════════════ -->
<div class="theme-switch" id="themeSwitch">
  <button data-theme="sakura" class="active">🌸<span class="label">樱梦</span></button>
  <button data-theme="starry">🌙<span class="label">星月</span></button>
  <button data-theme="forest">🍃<span class="label">森林</span></button>
  <button data-theme="dark">🌑<span class="label">暗夜</span></button>
</div>

<!-- ══════════════════════════════════════
     Main
     ══════════════════════════════════════ -->
<div class="app">

  <!-- PWA install banner -->
  <div class="install-banner hidden" id="installBanner">
    <span class="banner-icon">📲</span>
    <span class="banner-text"><strong>添加到主屏幕</strong><br>像 App 一样快速打开</span>
    <button class="banner-btn" id="installBtn">✨ 安装</button>
    <button class="banner-close" id="bannerClose">✕</button>
  </div>

  <header class="header">
    <span class="mascot">🦄</span>
    <h1>魔法待办清单</h1>
    <p class="date"><span>🌸</span> <span id="currentDate"></span> <span>🌸</span></p>
  </header>

  <div class="input-row">
    <input type="text" id="todoInput" placeholder="写下今天要做的事吧～" maxlength="150" autocomplete="off">
    <button id="addBtn">✨ 添加</button>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">🌸 全部</button>
    <button data-filter="active">📋 待办</button>
    <button data-filter="completed">✅ 完成</button>
  </div>

  <div class="stats-bar">
    <span class="count" id="statsText">共 0 条</span>
    <button id="clearDoneBtn">🧹 清除已完成</button>
  </div>

  <div id="todoContainer" style="flex:1; display:flex; flex-direction:column;">
    <!-- list or empty state rendered here -->
  </div>

  <footer class="footer">
    用 <span class="heart">💕</span> 制作 · 左滑删除 · 双击编辑 · 可添加到桌面
  </footer>
</div>

<script>
(function () {
  /* ─── DOM ─── */
  const input    = document.getElementById('todoInput');
  const addBtn   = document.getElementById('addBtn');
  const container = document.getElementById('todoContainer');
  const statsEl  = document.getElementById('statsText');
  const clearBtn = document.getElementById('clearDoneBtn');
  const filterBtns = document.querySelectorAll('.filters button');
  const dateEl   = document.getElementById('currentDate');
  const toastEl  = document.getElementById('toast');

  /* ─── State ─── */
  const KEY = 'maho_todo';
  let todos = [];
  let filter = 'all';
  let editingId = null;
  let toastTimer = null;

  /* ─── Storage ─── */
  function save() { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch(e) {} }
  function load() {
    try {
      const r = localStorage.getItem(KEY);
      if (!r) return [];
      const data = JSON.parse(r);
      if (!Array.isArray(data)) return [];
      return data.filter(t => t && typeof t.id === 'string' && t.text && t.text.trim() && typeof t.done === 'boolean');
    } catch(e) { return []; }
  }

  /* 老数据迁移：给没有时间戳的已完成任务补上时间 */
  function migrate() {
    let changed = false;
    const now = new Date().toISOString();
    todos.forEach(t => {
      if (t.done && !t.completedAt) { t.completedAt = now; changed = true; }
    });
    if (changed) save();
  }

  /* ─── Filters ─── */
  function filtered() {
    if (filter === 'active')    return todos.filter(t => !t.done);
    if (filter === 'completed') return todos.filter(t =>  t.done);
    return [...todos];
  }

  /* ─── Time formatting ─── */
  function formatTime(isoStr) {
    if (!isoStr) return ''; // 无时间戳不显示
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return ''; // 无效日期不显示
    // 完整年月日 + 时分秒
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  }

  /* ─── Theme ─── */
  const THEME_KEY = 'maho_theme';
  const themeSwitch = document.getElementById('themeSwitch');

  function setTheme(name) {
    document.body.classList.remove('theme-starry', 'theme-forest', 'theme-dark');
    if (name !== 'sakura') document.body.classList.add('theme-' + name);
    localStorage.setItem(THEME_KEY, name);
    themeSwitch.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.theme === name);
    });
  }

  themeSwitch.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    setTheme(btn.dataset.theme);
  });

  // 恢复上次主题
  const savedTheme = localStorage.getItem(THEME_KEY) || 'sakura';
  setTheme(savedTheme);

  /* ─── Toast ─── */
  function toast(msg) {
    if (toastTimer) clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('visible');
    toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 1500);
  }

  /* ─── Render ─── */
  function render() {
    const items = filtered();
    const remaining = todos.filter(t => !t.done).length;
    const completed = todos.length - remaining;
    statsEl.textContent = `共 ${todos.length} 条 · ${remaining} 未完成`;

    // 没有已完成任务时隐藏清除按钮，避免被误认为空行
    clearBtn.style.visibility = completed > 0 ? 'visible' : 'hidden';

    if (items.length === 0) {
      const icons = { all: '🌸', active: '🎉', completed: '😴' };
      const msgs  = {
        all: '还没有任务哦～<br>快添加今天要做的事吧！',
        active: '全部完成啦！<br>你超棒的～ 🎉',
        completed: '还没有已完成的任务…<br>加油完成第一项吧！'
      };
      container.innerHTML = `<div class="empty-state">
        <div class="icon">${icons[filter]}</div>
        <div class="msg">${msgs[filter]}</div>
      </div>`;
      return;
    }

    const ul = document.createElement('ul');
    ul.className = 'todo-list';

    items.forEach(t => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (t.done ? ' completed' : '');
      li.dataset.id = t.id;

      // swipe bg
      const swipeBg = document.createElement('div');
      swipeBg.className = 'swipe-bg';
      swipeBg.textContent = '🗑️';

      // checkbox
      const cb = document.createElement('div');
      cb.className = 'checkbox';
      cb.dataset.action = 'toggle';

      // delete btn
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-delete';
      delBtn.dataset.action = 'delete';
      delBtn.textContent = '🗑️';

      // text or edit
      let contentEl;
      if (editingId === t.id) {
        contentEl = document.createElement('input');
        contentEl.className = 'edit-input';
        contentEl.value = t.text;
        contentEl.dataset.action = 'editInput';

        li.appendChild(swipeBg);
        li.appendChild(cb);
        li.appendChild(contentEl);
        li.appendChild(delBtn);
      } else {
        // text wrapper
        const textWrap = document.createElement('div');
        textWrap.style.cssText = 'flex:1;min-width:0;';

        contentEl = document.createElement('span');
        contentEl.className = 'todo-text';
        contentEl.textContent = t.text;
        contentEl.dataset.action = 'edit';
        textWrap.appendChild(contentEl);

        // 完成时间
        if (t.done && t.completedAt) {
          const timeEl = document.createElement('span');
          timeEl.className = 'todo-time';
          timeEl.textContent = formatTime(t.completedAt);
          textWrap.appendChild(timeEl);
        }

        li.appendChild(swipeBg);
        li.appendChild(cb);
        li.appendChild(textWrap);
        li.appendChild(delBtn);
      }

      ul.appendChild(li);
    });

    container.innerHTML = '';
    container.appendChild(ul);

    // auto-focus edit input
    if (editingId) {
      requestAnimationFrame(() => {
        const inp = container.querySelector('[data-action="editInput"]');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });
    }
  }

  /* ─── Actions ─── */
  function add(text) {
    const t = text.trim();
    if (!t) return;
    todos.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), text: t, done: false, completedAt: null });
    save(); render();
    input.value = '';
    input.focus();
  }

  function toggle(id) {
    const t = todos.find(t => t.id === id);
    if (!t) return;
    t.done = !t.done;
    // 记录完成时间 / 取消完成时清除时间
    t.completedAt = t.done ? new Date().toISOString() : null;
    save(); render();
    // pop animation
    requestAnimationFrame(() => {
      const el = container.querySelector(`[data-id="${id}"]`);
      if (el) { el.classList.add('popping'); el.addEventListener('animationend', () => el.classList.remove('popping'), {once:true}); }
    });
    if (t.done) toast('✅ 任务完成！');
  }

  function remove(id) {
    const idx = todos.findIndex(t => t.id === id);
    if (idx === -1) return;
    const wasEditing = editingId === id;
    todos.splice(idx, 1);
    if (wasEditing) editingId = null;
    save(); render();
    toast('已删除');
  }

  function startEdit(id) {
    editingId = id;
    render();
  }

  function commitEdit(id, newText) {
    const t = todos.find(t => t.id === id);
    if (t) {
      const trim = newText.trim();
      if (trim) t.text = trim;
    }
    editingId = null;
    save(); render();
  }

  function clearDone() {
    const before = todos.length;
    todos = todos.filter(t => !t.done);
    if (before === todos.length) { toast('没有已完成的任务哦～'); return; }
    editingId = null;
    save(); render();
    toast(`清除了 ${before - todos.length} 条 🧹`);
  }

  function setFilter(f) {
    filter = f;
    editingId = null;
    filterBtns.forEach(b => b.classList.toggle('active', b.dataset.filter === f));
    render();
  }

  /* ─── Swipe to delete ─── */
  let touchStartX = 0, touchStartY = 0, swipeTarget = null, swiped = false;

  container.addEventListener('touchstart', e => {
    const item = e.target.closest('.todo-item');
    if (!item || editingId) return;
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    swipeTarget = item;
    swiped = false;
  }, { passive: true });

  container.addEventListener('touchmove', e => {
    if (!swipeTarget) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    // only horizontal swipe
    if (Math.abs(dx) > Math.abs(dy) && dx < -25) {
      const bg = swipeTarget.querySelector('.swipe-bg');
      if (bg) bg.classList.add('show');
      swiped = true;
    }
  }, { passive: true });

  container.addEventListener('touchend', e => {
    if (!swipeTarget) return;
    // reset all swipe states
    document.querySelectorAll('.swipe-bg.show').forEach(b => b.classList.remove('show'));
    if (swiped) {
      const id = swipeTarget.dataset.id;
      if (id) {
        // visual feedback before delete
        swipeTarget.style.transform = 'translateX(-80px)';
        swipeTarget.style.opacity = '0';
        swipeTarget.style.transition = 'all 0.25s ease';
        swipeTarget.addEventListener('transitionend', function handler() {
          swipeTarget.removeEventListener('transitionend', handler);
          remove(id);
        });
      }
    }
    swipeTarget = null;
    swiped = false;
  });

  /* ─── Click delegation ─── */
  container.addEventListener('click', e => {
    const btn  = e.target.closest('[data-action]');
    const item = e.target.closest('.todo-item');
    if (!btn || !item) return;
    if (editingId) return; // ignore clicks while editing
    const id = item.dataset.id;
    const action = btn.dataset.action;

    if (action === 'toggle')  toggle(id);
    if (action === 'delete')  remove(id);
    if (action === 'edit')    startEdit(id);
  });

  /* ─── Double-click to edit ─── */
  container.addEventListener('dblclick', e => {
    const textEl = e.target.closest('.todo-text');
    if (textEl && !editingId) {
      const item = textEl.closest('.todo-item');
      if (item) startEdit(item.dataset.id);
    }
  });

  /* ─── Edit input keyboard ─── */
  container.addEventListener('keydown', e => {
    if (e.target.dataset.action !== 'editInput') return;
    const item = e.target.closest('.todo-item');
    if (!item) return;
    if (e.key === 'Enter')  { e.preventDefault(); commitEdit(item.dataset.id, e.target.value); }
    if (e.key === 'Escape') { e.preventDefault(); editingId = null; render(); }
  });

  /* ─── Edit input blur ─── */
  container.addEventListener('blur', e => {
    if (e.target.dataset.action === 'editInput') {
      const item = e.target.closest('.todo-item');
      if (item) commitEdit(item.dataset.id, e.target.value);
    }
  }, true);

  /* ─── Add ─── */
  addBtn.addEventListener('click', () => add(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') add(input.value); });

  /* ─── Clear done ─── */
  clearBtn.addEventListener('click', clearDone);

  /* ─── Filters ─── */
  filterBtns.forEach(b => b.addEventListener('click', () => setFilter(b.dataset.filter)));

  /* ─── Date ─── */
  (function updateDate() {
    dateEl.textContent = new Date().toLocaleDateString('zh-CN', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
  })();

  /* ─── PWA: Service Worker ─── */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        console.log('✅ SW registered:', reg.scope);
      }).catch(err => {
        console.log('SW registration failed:', err);
      });
    });
  }

  /* ─── PWA: Install Prompt ─── */
  let deferredPrompt = null;
  const installBanner = document.getElementById('installBanner');
  const installBtn    = document.getElementById('installBtn');
  const bannerClose   = document.getElementById('bannerClose');
  const isStandalone  = window.matchMedia('(display-mode: standalone)').matches
                     || navigator.standalone
                     || window.matchMedia('(display-mode: fullscreen)').matches;

  // 监听 beforeinstallprompt（Android Chrome 等）
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    // 非独立窗口模式时显示安装横幅
    if (!isStandalone) {
      installBanner.classList.remove('hidden');
    }
  });

  // 用户点击「安装」
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) {
      // 降级：iOS 或其他不支持 beforeinstallprompt 的情况
      showIOSGuide();
      return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('Install outcome:', outcome);
    deferredPrompt = null;
    installBanner.classList.add('hidden');
  });

  // 关闭横幅
  bannerClose.addEventListener('click', () => {
    installBanner.classList.add('hidden');
  });

  // 已安装后隐藏横幅
  window.addEventListener('appinstalled', () => {
    installBanner.classList.add('hidden');
    deferredPrompt = null;
    toast('🎉 安装成功！');
  });

  // iOS 引导提示
  function showIOSGuide() {
    const isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
    if (isIOS) {
      toast('🍎 点 Safari 底部「分享」→「添加到主屏幕」');
    } else {
      toast('📲 点浏览器菜单 →「添加到主屏幕」');
    }
    installBanner.classList.add('hidden');
  }

  // 如果在独立模式中，不显示横幅
  if (isStandalone) {
    installBanner.classList.add('hidden');
  }

  // 如果是不支持 beforeinstallprompt 且不是独立模式的 iOS，3秒后显示引导
  if (!isStandalone && /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase())) {
    setTimeout(() => {
      if (!deferredPrompt) {
        installBanner.classList.remove('hidden');
        installBanner.querySelector('.banner-text').innerHTML =
          '<strong>添加到主屏幕</strong><br>像 App 一样快速打开';
        installBtn.textContent = '📘 教程';
      }
    }, 3000);
  }

  /* ─── Init ─── */
  todos = load();
  migrate(); // 给老数据补上完成时间
  render();
  input.focus();
})();
</script>
