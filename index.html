  /* ── 主题：极光 ── */
  body.theme-aurora {

    --bg: #ecfeff; --card: rgba(255,255,255,0.85); --text: #0c4a6e; --text2: #4a7a8e;

    --chibi-skin: #ffe0d0; --chibi-eye: #0c4a6e; --chibi-blush: #a5f3fc; --chibi-hair1: #67e8f9; --chibi-hair1d: #06b6d4; --chibi-hair2: #bae6fd; --chibi-hair2d: #7dd3fc; --chibi-hair2m: #e0f2fe; --chibi-ribbon: #0891b2; --chibi-mouth: #22d3ee;

  /* ── 主题：暗夜 ── */

    --pink: #f59e0b; --pink-light: #fcd34d; --purple: #8b5cf6; --purple-light: #c4b5fd; --blue: #67e8f9;
    --bg: #0f172a; --card: rgba(30,41,59,0.92); --text: #f1f5f9; --text2: #cbd5e1;
    --border: #334155; --shadow: 0 4px 24px rgba(0,0,0,0.5);
    --grad-body: linear-gradient(170deg, #0f172a 0%, #1e1b4b 40%, #0f172a 70%, #1a1a2e 100%);
    --grad-title: linear-gradient(135deg, #f59e0b, #fbbf24, #eab308);

	    --petal-radius: 50%; --petal-size: 7px; --star-opacity: 0.30; --moon-opacity: 0.75;
    --skin: #ffe0d0;
	    --date-font: 'LiSu', '隶书', 'Baoli SC', 'Noto Serif SC', serif;

    --chibi-skin: #ffe0d0; --chibi-eye: #e2e8f0; --chibi-blush: #fcd34d; --chibi-hair1: #fcd34d; --chibi-hair1d: #f59e0b; --chibi-hair2: #c4b5fd; --chibi-hair2d: #8b5cf6; --chibi-hair2m: #a78bfa; --chibi-ribbon: #f59e0b; --chibi-mouth: #fbbf24;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--grad-body);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ══════════════════════════════════════
     Background decorations
     ══════════════════════════════════════ */
  .bg-deco {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .sparkle {
    position: absolute;
    animation: sparkleFloat 3.5s ease-in-out infinite;
    font-size: 1rem;
    opacity: 0.45;
  }
  .sparkle:nth-child(1)  { top: 3%;  left: 6%;  animation-delay: 0s;    animation-duration: 3.2s; font-size: 0.9rem; }
  .sparkle:nth-child(2)  { top: 6%;  left: 85%; animation-delay: 0.6s;  animation-duration: 2.8s; font-size: 1.1rem; }
  .sparkle:nth-child(3)  { top: 20%; left: 3%;  animation-delay: 1.2s;  animation-duration: 3.6s; font-size: 0.8rem; }
  .sparkle:nth-child(4)  { top: 28%; left: 90%; animation-delay: 1.8s;  animation-duration: 3.0s; font-size: 1.0rem; }
  .sparkle:nth-child(5)  { top: 52%; left: 5%;  animation-delay: 2.4s;  animation-duration: 3.3s; font-size: 1.2rem; }
  .sparkle:nth-child(6)  { top: 48%; left: 93%; animation-delay: 0.3s;  animation-duration: 2.9s; font-size: 0.9rem; }
  .sparkle:nth-child(7)  { top: 70%; left: 8%;  animation-delay: 1.4s;  animation-duration: 3.7s; font-size: 0.7rem; }
  .sparkle:nth-child(8)  { top: 65%; left: 88%; animation-delay: 2.0s;  animation-duration: 3.1s; font-size: 1.0rem; }
  .sparkle:nth-child(9)  { top: 14%; left: 45%; animation-delay: 0.8s;  animation-duration: 3.4s; font-size: 1.3rem; }
  .sparkle:nth-child(10) { top: 38%; left: 50%; animation-delay: 2.8s;  animation-duration: 2.6s; font-size: 0.8rem; }
  .sparkle:nth-child(11) { top: 78%; left: 55%; animation-delay: 1.0s;  animation-duration: 3.8s; font-size: 1.0rem; }
  .sparkle:nth-child(12) { top: 90%; left: 40%; animation-delay: 3.2s;  animation-duration: 2.7s; font-size: 0.9rem; }

  @keyframes sparkleFloat {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
    50%      { transform: translateY(-14px) scale(1.3); opacity: 0.75; }
  }

  .petal {
    position: absolute;
    width: var(--petal-size, 10px); height: var(--petal-size, 10px);
    background: var(--petal-bg);
    border-radius: var(--petal-radius, 50% 0 50% 0);
    animation: petalFall linear infinite;
    opacity: 0;
  }
  .petal:nth-child(13) { left: 8%;  animation-duration: 9s;  animation-delay: 0s;  --petal-size: 10px; }
  .petal:nth-child(14) { left: 22%; animation-duration: 11s; animation-delay: 2.5s; --petal-size: 8px; }
  .petal:nth-child(15) { left: 68%; animation-duration: 10s; animation-delay: 4.5s; --petal-size: 7px; }
  .petal:nth-child(16) { left: 85%; animation-duration: 12s; animation-delay: 1.5s; --petal-size: 11px; }
  .petal:nth-child(17) { left: 40%; animation-duration: 8.5s;animation-delay: 3.5s; --petal-size: 9px; }
  .petal:nth-child(18) { left: 55%; animation-duration: 10.5s;animation-delay: 5.5s; --petal-size: 6px; }
  .petal:nth-child(19) { left: 15%; animation-duration: 9.5s;animation-delay: 1.0s; --petal-size: 12px; }
  .petal:nth-child(20) { left: 48%; animation-duration: 11.5s;animation-delay: 6.0s; --petal-size: 8px; }
  .petal:nth-child(21) { left: 75%; animation-duration: 8.0s;animation-delay: 3.0s; --petal-size: 10px; }
  .petal:nth-child(22) { left: 32%; animation-duration: 10.8s;animation-delay: 5.0s; --petal-size: 7px; }
  .petal:nth-child(23) { left: 92%; animation-duration: 9.2s;animation-delay: 0.8s; --petal-size: 9px; }
  .petal:nth-child(24) { left: 5%;  animation-duration: 10.2s;animation-delay: 4.0s; --petal-size: 6px; }

  @keyframes petalFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.5; }
    92%  { opacity: 0.5; }
    100% { transform: translateY(105vh) rotate(600deg); opacity: 0; }
  }

  /* ── 手机端装饰缩小 ── */
  @media (max-width: 480px) {
    .sparkle { font-size: 0.7rem !important; }
    .petal { --petal-size: 5px !important; }
    .moon-glow { font-size: 1.5rem; top: 4%; right: 6%; }
    .chibi-mini svg { width: 36px; height: 40px; }
    .chibi-bar { height: 48px; padding: 3px 6px 0; padding-top: calc(3px + env(safe-area-inset-top, 24px)); }
    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.25; }
      50%      { transform: translateY(-7px) scale(1.15); opacity: 0.6; }
    }
  }
  
  /* ── 星空特效（暗夜主题专属）── */
  .starfield { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star-dot { position: absolute; background: #fff; border-radius: 50%; animation: twinkle calc(2s + var(--sd,0s)) ease-in-out infinite; animation-delay: var(--sdl,0s); }
  @keyframes twinkle { 0%,100%{opacity:0.15;transform:scale(1)} 50%{opacity:1;transform:scale(1.8)} }
  .moon-glow { position: fixed; top: 6%; right: 10%; font-size: 2.2rem; pointer-events: none; z-index: 0; animation: moonPulse 4s ease-in-out infinite; }
  @keyframes moonPulse { 0%,100%{filter:drop-shadow(0 0 6px rgba(251,191,36,0.3))} 50%{filter:drop-shadow(0 0 18px rgba(251,191,36,0.8))} }
  .shooting { position: absolute; width: 60px; height: 1.5px; background: linear-gradient(90deg,transparent,#fcd34d); border-radius: 2px; pointer-events: none; animation: shoot 1.8s linear forwards; opacity: 0; }
  @keyframes shoot { 0%{transform:translateX(-60px) translateY(0);opacity:0} 15%{opacity:0.8} 35%{opacity:0;transform:translateX(200px) translateY(-30px)} 100%{opacity:0;transform:translateX(200px) translateY(-30px)} }

  /* ══════════════════════════════════════
     Chibi characters — top bar style for mobile
     ══════════════════════════════════════ */
  .chibi-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 6px 14px 0;
    padding-top: calc(6px + env(safe-area-inset-top, 24px));
    background: linear-gradient(to bottom, rgba(255,245,249,0.95) 60%, rgba(255,245,249,0) 100%);
  }

  .chibi-mini {
    animation: chibiWave 3s ease-in-out infinite;
  }
  .chibi-mini:last-child { animation-delay: 0.8s; }

  @keyframes chibiWave {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  /* ══════════════════════════════════════
     Main App
     ══════════════════════════════════════ */
  .app {
    width: 100%;
    max-width: 460px;
    padding: 50px 16px 80px;
    padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .header .mascot {
    font-size: 2.4rem;
    display: block;
    animation: mascotBounce 2s ease-in-out infinite;
    line-height: 1;
  }

  @keyframes mascotBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    30%      { transform: translateY(-8px) scale(1.06); }
    50%      { transform: translateY(0) scale(1); }
    70%      { transform: translateY(-4px) scale(1.03); }
  }

  .header h1 {
    font-size: 1.4rem;
    font-weight: 800;
    background: var(--grad-title);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleShine 3s ease-in-out infinite;
    letter-spacing: 2px;
    margin-top: -4px;
  }

  @keyframes titleShine {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .header .date {
    font-size: 0.75rem;
    color: var(--text2);
	    font-family: var(--date-font);
	    font-weight: var(--date-weight, 400);
	    letter-spacing: var(--date-spacing, 0);
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  /* ── Input ── */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .input-row input {
    flex: 1;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.92rem;
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text);
    outline: none;
    transition: 0.2s ease;
    min-width: 0;
    height: 48px;
  }

  .input-row input:focus {
    border-color: #c471ed;
    box-shadow: 0 0 0 4px rgba(196,113,237,0.1);
  }

  .input-row input::placeholder { color: var(--placeholder); }

  .input-row button {
    padding: 0 20px;
    height: 48px;
    background: var(--grad-btn);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s ease;
    white-space: nowrap;
    box-shadow: 0 3px 12px rgba(196,113,237,0.3);
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .input-row button:active {
    transform: scale(0.94);
    box-shadow: 0 2px 8px rgba(196,113,237,0.2);
  }

  /* ── Filters ── */
  .filters {
    display: flex;
    gap: 5px;
    margin-bottom: 12px;
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: var(--radius);
    padding: 5px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .filters button {
    flex: 1;
    height: 40px; padding: 0 4px;
    border: none;
    border-radius: 13px;
    background: transparent;
    color: var(--text2);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
    white-space: nowrap;
  }

  .filters button.active {
    background: var(--grad-filter);
    color: #fff;
    box-shadow: 0 2px 10px rgba(196,113,237,0.25);
  }

  /* ── Category selector ── */
  .cat-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .cat-btn {
    width: 40px; height: 40px;
    border: 2px solid transparent;
    border-radius: 50%;
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
  }

  .cat-btn.active {
    border-color: var(--pink);
    background: #fff0f5;
    transform: scale(1.1);
    box-shadow: 0 2px 12px rgba(255,107,157,0.3);
  }

  .cat-btn:active {
    transform: scale(0.92);
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.75rem;
    padding: 0 6px;
  }

  .stats-bar .count {
    background: var(--grad-count);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 600;
    color: var(--purple);
    font-size: 0.73rem;
  }

  .stats-bar button {
    background: none;
    border: 1px solid var(--clear-btn-border);
    color: var(--clear-btn-color);
    cursor: pointer;
    font-size: 0.73rem;
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: 600;
    transition: 0.2s ease;
  }

  .stats-bar button:active { background: #fff0f5; }

  /* ── Todo List ── */
  .todo-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 14px;
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .todo-item:hover {
    border-color: var(--border);
    box-shadow: 0 8px 28px rgba(180,130,160,0.15);
    transform: translateY(-1px);
  }

  .todo-item:active {
    transform: scale(0.985);
    border-color: #f0d5e8;
  }

  .todo-item.completed {
    opacity: 0.5;
    background: rgba(255,255,255,0.45);
  }

  /* swipe delete indicator */
  .todo-item .swipe-bg {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 0;
    background: linear-gradient(135deg, #ff6b6b, #ff4444);
    border-radius: var(--radius);
    transition: width 0.15s ease;
    display: none;
    align-items: center;
    justify-content: flex-end;
    padding-right: 0;
    color: #fff;
    font-size: 1.1rem;
    overflow: hidden;
    z-index: 0;
  }

  .todo-item .swipe-bg.show {
    display: flex;
    padding-right: 16px;
  }

  .todo-item > *:not(.swipe-bg) {
    position: relative;
    z-index: 1;
  }

  /* category icon */
  .todo-cat {
    flex-shrink: 0;
    font-size: 1.15rem;
    cursor: pointer;
    width: 24px;
    text-align: center;
  }

  /* checkbox */
  .checkbox {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border: 2.5px solid var(--checkbox-border);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }

  .todo-item.completed .checkbox {
    background: var(--grad-checkbox);
    border-color: transparent;
  }

  .checkbox::after {
    content: '';
    display: none;
    width: 5px; height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translateY(-1px);
  }

  .todo-item.completed .checkbox::after { display: block; }

  /* text */
  .todo-text {
    flex: 1;
    font-size: 0.9rem;
    word-break: break-all;
    line-height: 1.4;
    min-width: 0;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: var(--completed-text);
  }

  .todo-time {
    display: block;
    font-size: 0.7rem;
    color: var(--time-text);
	    font-family: var(--time-font);
    margin-top: 3px;
    font-weight: var(--time-weight, 500);
	    letter-spacing: var(--time-spacing, 0);
  }

  /* edit input */
  .edit-input {
    flex: 1;
    padding: 7px 10px;
    border: 2px solid #c471ed;
    border-radius: 10px;
    font-size: 0.9rem;
    outline: none;
    background: rgba(255,255,255,0.9);
    color: var(--text);
    box-shadow: 0 0 0 3px rgba(196,113,237,0.08);
    min-width: 0;
  }

  /* delete btn */
  .btn-delete {
    width: 34px; height: 34px;
    border: none;
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
    font-size: 1.1rem;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s ease;
    opacity: 0.5;
  }

  .todo-item:active .btn-delete,
  .btn-delete.show { opacity: 1; }

  /* ── Empty state ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    color: var(--text2);
  }

  .empty-state .icon {
    font-size: 4rem;
    margin-bottom: 14px;
    animation: emptyFloat 3s ease-in-out infinite;
  }

  @keyframes emptyFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .empty-state .msg {
    font-size: 0.9rem;
    line-height: 1.6;
  }

  /* ── Animation ── */
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .todo-item { animation: slideIn 0.28s ease; }

  /* completed bounce */
  @keyframes popIn {
    0%   { transform: scale(1); }
    40%  { transform: scale(0.92); }
    70%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .todo-item.popping { animation: popIn 0.3s ease; }

  /* ── Footer ── */
  .footer {
    text-align: center;
    margin-top: auto;
    padding: 14px 0 8px;
    font-size: 0.7rem;
    color: var(--text2);
    opacity: 0.6;
  }

  .footer .heart {
    display: inline-block;
    animation: heartBeat 1.2s ease-in-out infinite;
    color: var(--pink);
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.2); }
    30%      { transform: scale(1); }
  }

  /* ══════════════════════════════════════
     Toast
     ══════════════════════════════════════ */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(74,48,85,0.9);
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 0.8rem;
    z-index: 99;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }

  /* ══════════════════════════════════════
     Larger screens — show bigger chibis
     ══════════════════════════════════════ */
  @media (min-width: 700px) {
    .chibi-bar { display: none; }

    .chibi-side {
      position: fixed;
      bottom: 30px;
      z-index: 1;
      pointer-events: none;
    }
    .chibi-side.left  { left: max(8px, calc(50% - 320px)); }
    .chibi-side.right { right: max(8px, calc(50% - 320px)); }
    .chibi-side .chibi-bounce { animation: chibiSideBounce 4s ease-in-out infinite; }
    .chibi-side.right .chibi-bounce { animation-delay: 1s; }

    @keyframes chibiSideBounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
  }

  @media (max-width: 699px) {
    .chibi-side { display: none; }
  }

  /* ══════════════════════════════════════
     Install banner
     ══════════════════════════════════════ */
  .install-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--grad-banner);
    color: #fff;
    border-radius: var(--radius);
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(60,30,70,0.25);
    position: relative;
    overflow: hidden;
    animation: bannerSlide 0.4s ease;
  }
  .install-banner.hidden { display: none; }

  @keyframes bannerSlide {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .install-banner::before {
    content: '';
    position: absolute;
    top: -20px; right: -20px;
    width: 60px; height: 60px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }

  .install-banner .banner-icon {
    font-size: 1.5rem;
    flex-shrink: 0;
    animation: mascotBounce 2s ease-in-out infinite;
  }

  .install-banner .banner-text {
    flex: 1;
    font-size: 0.78rem;
    line-height: 1.4;
  }
  .install-banner .banner-text strong { color: var(--pink-light); }

  .install-banner .banner-btn {
    padding: 8px 14px;
    background: var(--grad-install-btn);
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .install-banner .banner-btn:active { transform: scale(0.94); }

  .install-banner .banner-close {
    position: absolute;
    top: 4px; right: 8px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 1rem;
    cursor: pointer;
    padding: 2px 6px;
  }

  /* ══════════════════════════════════════
     Theme toggle — bottom bar
     ══════════════════════════════════════ */
  .theme-switch {
    position: fixed;
    bottom: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    z-index: 99;
    display: flex;
    gap: 4px;
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 26px;
    padding: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    border: 1.5px solid var(--border);
    max-width: calc(100vw - 24px);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .theme-switch button {
    height: 34px;
    min-width: 34px;
    padding: 0 12px;
    border-radius: 22px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.25s ease;
    font-size: 0.78rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 3px;
    background: transparent;
    color: var(--text2);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .theme-switch button .label { display: inline; }
  .theme-switch button.active {
    background: var(--grad-btn);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 12px rgba(196,113,237,0.3);
  }
  .theme-switch button:active { transform: scale(0.94); }

  /* 手机窄屏：只显示 emoji，隐藏文字 */
  @media (max-width: 400px) {
    .theme-switch button { padding: 0 8px; min-width: 36px; justify-content: center; }
    .theme-switch button .label { display: none; }
  }

  /* ══════════════════════════════════════
     Theme overrides for hardcoded values
     ══════════════════════════════════════ */

  /* --- 星月夜 --- */
  body.theme-starry .filters button.active { background: var(--grad-filter); color: #fff; }

  body.theme-starry .todo-item.completed .checkbox { background: var(--grad-checkbox); }

  body.theme-starry .stats-bar .count { background: var(--grad-count); color: #6366f1; }

  body.theme-starry .install-banner { background: var(--grad-banner); }

  body.theme-starry .install-banner .banner-btn { background: var(--grad-install-btn); }

  body.theme-starry .chibi-bar { background: var(--chibi-bar-bg); }

  body.theme-starry .checkbox { border-color: var(--checkbox-border); }

  body.theme-starry .petal { background: var(--petal-bg); }

  body.theme-starry .sparkle { filter: hue-rotate(40deg) saturate(0.8); }

  body.theme-starry .input-row input:focus { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(99,102,241,0.12); }

  body.theme-starry .input-row button { box-shadow: 0 3px 12px rgba(99,102,241,0.3); }

  body.theme-starry .filters button:hover::after { background: linear-gradient(90deg, #818cf8, #a78bfa); }

  body.theme-starry .todo-item:hover { border-color: #d4c8f0; box-shadow: 0 8px 28px rgba(100,90,160,0.18); }

  /* --- 森林物语 --- */
  body.theme-forest .filters button.active { background: var(--grad-filter); color: #fff; }

  body.theme-forest .todo-item.completed .checkbox { background: var(--grad-checkbox); }

  body.theme-forest .stats-bar .count { background: var(--grad-count); color: #059669; }

  body.theme-forest .install-banner { background: var(--grad-banner); }

  body.theme-forest .install-banner .banner-btn { background: var(--grad-install-btn); }

  body.theme-forest .chibi-bar { background: var(--chibi-bar-bg); }

  body.theme-forest .checkbox { border-color: var(--checkbox-border); }

  body.theme-forest .petal { background: var(--petal-bg); }

  body.theme-forest .sparkle { filter: hue-rotate(200deg) saturate(0.9); }

  body.theme-forest .input-row input:focus { border-color: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,0.12); }

  body.theme-forest .input-row button { box-shadow: 0 3px 12px rgba(5,150,105,0.3); }

  body.theme-forest .filters button:hover::after { background: linear-gradient(90deg, #10b981, #34d399); }

  body.theme-forest .todo-item:hover { border-color: #c6f0d8; box-shadow: 0 8px 28px rgba(80,150,110,0.15); }

  /* --- 极光 --- */
  body.theme-aurora .filters button.active { background: var(--grad-filter); color: #fff; }
  body.theme-aurora .todo-item.completed .checkbox { background: var(--grad-checkbox); }
  body.theme-aurora .stats-bar .count { background: var(--grad-count); color: #0891b2; }
  body.theme-aurora .install-banner { background: var(--grad-banner); }
  body.theme-aurora .install-banner .banner-btn { background: var(--grad-install-btn); }
  body.theme-aurora .chibi-bar { background: var(--chibi-bar-bg); }
  body.theme-aurora .checkbox { border-color: var(--checkbox-border); }
  body.theme-aurora .petal { background: var(--petal-bg); }
  body.theme-aurora .sparkle { filter: hue-rotate(160deg) saturate(0.9); }
  body.theme-aurora .input-row input:focus { border-color: #06b6d4; box-shadow: 0 0 0 4px rgba(6,182,212,0.12); }
  body.theme-aurora .input-row button { box-shadow: 0 3px 12px rgba(8,145,178,0.3); }
  body.theme-aurora .filters button:hover::after { background: linear-gradient(90deg, #06b6d4, #2dd4bf); }
  body.theme-aurora .todo-item:hover { border-color: #c7e8f0; box-shadow: 0 8px 28px rgba(40,150,180,0.15); }

  /* --- 暗夜 --- */
  body.theme-dark .filters button.active { background: var(--grad-filter); color: #fff; }
  body.theme-dark .todo-item.completed .checkbox { background: var(--grad-checkbox); }
  body.theme-dark .stats-bar .count { background: var(--grad-count); color: #f59e0b; }
  body.theme-dark .install-banner { background: var(--grad-banner); }
  body.theme-dark .install-banner .banner-btn { background: var(--grad-install-btn); }
  body.theme-dark .chibi-bar { background: var(--chibi-bar-bg); }
  body.theme-dark .checkbox { border-color: var(--checkbox-border); background: rgba(0,0,0,0.2); }
  body.theme-dark .stats-bar button { border-color: var(--clear-btn-border); color: var(--clear-btn-color); }
  body.theme-dark .todo-item.completed .todo-text { color: var(--completed-text); }
  body.theme-dark .petal { background: var(--petal-bg); }
  body.theme-dark .sparkle { filter: brightness(1.5); }
  body.theme-dark .input-row input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 4px rgba(139,92,246,0.2); }
  body.theme-dark .input-row button { box-shadow: 0 3px 12px rgba(139,92,246,0.3); }
  body.theme-dark .filters button:hover::after { background: linear-gradient(90deg, #f59e0b, #8b5cf6); }
  body.theme-dark .todo-item:hover { border-color: #475569; box-shadow: 0 8px 28px rgba(0,0,0,0.3); }
  body.theme-dark .checkmark { border-color: #475569; }
  body.theme-dark .theme-switch { background: rgba(30,41,59,0.92); border-color: #334155; }
  body.theme-dark .theme-switch button.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; border-color: #f59e0b; }
  body.theme-dark .install-banner .banner-text strong { color: #fcd34d; }
  body.theme-dark .toast { background: rgba(30,27,75,0.95); color: #fcd34d; border-color: rgba(245,158,11,0.2); }
  body.theme-dark .todo-text { font-weight: 500; }
  body.theme-dark .theme-switch button { color: #b0bdd0; }
  body.theme-dark .bg-deco .sparkle { filter: brightness(1.4); }
  body.theme-dark .bg-deco .petal { opacity: 0.3; }
  /* 浅色主题下星空更淡 */
  .star-dot { opacity: var(--star-opacity, 0.06); transition: opacity 0.4s; }
  .moon-glow { opacity: var(--moon-opacity, 0.15); transition: opacity 0.4s; }
</style>
</head>

<!-- ══════════════════════════════════════
     Main
     ══════════════════════════════════════ -->
<div class="app">

  <!-- PWA install banner -->
  <div class="install-banner hidden" id="installBanner">
    <span class="banner-icon">📲</span>
    <span class="banner-text"><strong>添加到主屏幕</strong><br>像 App 一样快速打开</span>
    <button class="banner-btn" id="installBtn">✨ 安装</button>
    <button class="banner-close" id="bannerClose">✕</button>
  </div>

  <header class="header">
    <span class="mascot">🦄</span>
    <h1>魔法待办清单</h1>
    <p class="date"><span>🌸</span> <span id="currentDate"></span> <span>🌸</span></p>
  </header>

  <div class="input-row">
    <input type="text" id="todoInput" placeholder="写下今天要做的事吧～" maxlength="150" autocomplete="off">
    <button id="addBtn">✨ 添加</button>
  </div>

  <div class="cat-row" id="catRow">
    <button class="cat-btn active" data-cat="">📋</button>
    <button class="cat-btn" data-cat="work">💼</button>
    <button class="cat-btn" data-cat="life">🏠</button>
    <button class="cat-btn" data-cat="study">📖</button>
    <button class="cat-btn" data-cat="health">❤️</button>
    <button class="cat-btn" data-cat="shop">🛒</button>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">🌸 全部</button>
    <button data-filter="active">📋 待办</button>
    <button data-filter="completed">✅ 完成</button>
  </div>

  <div class="stats-bar">
    <span class="count" id="statsText">共 0 条</span>
    <button id="clearDoneBtn">🧹 清除已完成</button>
  </div>

  <div id="todoContainer" style="flex:1; display:flex; flex-direction:column;">
    <!-- list or empty state rendered here -->
  </div>

  <footer class="footer">
    用 <span class="heart">💕</span> 制作 · 左滑删除 · 双击编辑 · 可添加到桌面
  </footer>
</div>

  const toastEl  = document.getElementById('toast');

  const KEY = 'todo_data';

  const THEME_KEY = 'todo_theme';
  const OLD_THEME_KEYS = ['maho_theme', 'hoshi_theme'];
  const MIGRATED_FLAG = 'todo_migrated_v1';

  let toastTimer = null;

  /* ─── Category icons ─── */

  const catBtns = document.querySelectorAll('.cat-btn');

  /* ─── Storage ─── */
  function save() { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch(e) {} }
  function load() {
    try {
      const r = localStorage.getItem(KEY);
      if (!r) return [];
      const data = JSON.parse(r);
      if (!Array.isArray(data)) return [];
      return data.filter(t => t && typeof t.id === 'string' && t.text && t.text.trim() && typeof t.done === 'boolean');
    } catch(e) { return []; }
  }

  /* 合并旧版本数据到新key */
  function migrateData() {
    if (localStorage.getItem(MIGRATED_FLAG)) return; // 已经迁移过了
    let merged = [];
    OLD_KEYS.forEach(oldKey => {
      try {
        const raw = localStorage.getItem(oldKey);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (!Array.isArray(data)) return;
        const valid = data.filter(t => t && typeof t.id === 'string' && t.text && t.text.trim() && typeof t.done === 'boolean');
        valid.forEach(item => {
          if (!merged.some(m => m.text === item.text)) merged.push(item);
        });
      } catch(e) {}
    });
    if (merged.length > 0) {
      const existing = load();
      merged.forEach(item => {
        if (!existing.some(e => e.text === item.text)) existing.push(item);
      });
      todos = existing;
      save();
    }
    // 迁移主题
    let theme = null;
    for (const tk of OLD_THEME_KEYS) {
      const v = localStorage.getItem(tk);
      if (v) { theme = v; break; }
    }
    if (theme) {
      // 映射旧主题名
      const map = { night: 'starry', twilight: 'dark' };
      const mapped = map[theme] || theme;
      if (['sakura','starry','aurora','forest','dark'].includes(mapped)) {
        localStorage.setItem(THEME_KEY, mapped);
      }
    }
    // 清理旧key
    OLD_KEYS.forEach(k => { try { localStorage.removeItem(k); } catch(e) {} });
    OLD_THEME_KEYS.forEach(k => { try { localStorage.removeItem(k); } catch(e) {} });
    localStorage.setItem(MIGRATED_FLAG, '1');
  }

  /* 老数据迁移：给没有时间戳的已完成任务补上时间 */
  function migrate() {
    let changed = false;
    const now = new Date().toISOString();
    todos.forEach(t => {
      if (t.done && !t.completedAt) { t.completedAt = now; changed = true; }
    });
    if (changed) save();
  }

  /* ─── Filters ─── */
  function filtered() {
    let result = [...todos];
    if (filter === 'active')    result = result.filter(t => !t.done);
    if (filter === 'completed') result = result.filter(t =>  t.done);
    if (cat) result = result.filter(t => (t.cat || '') === cat);
    return result;
  }

  /* ─── Time formatting ─── */
  function formatTime(isoStr) {
    if (!isoStr) return ''; // 无时间戳不显示
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return ''; // 无效日期不显示
    // 完整年月日 + 时分秒
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  }

      dR: `<svg width="130" height="220" viewBox="0 0 130 220"><ellipse cx="65" cy="210" rx="40" ry="7" fill="rgba(0,0,0,0.2)"/><ellipse cx="65" cy="142" rx="30" ry="32" fill="var(--chibi-skin)"/><path d="M35 142 Q33 107 50 97 Q60 89 70 89 Q80 89 90 97 Q107 107 95 142 Q103 134 104 118 Q107 102 100 92 Q86 79 65 81 Q44 79 30 92 Q23 102 26 118 Q27 134 35 142 Z" fill="var(--chibi-hair2)"/><path d="M33 130 Q18 134 14 150 Q10 162 12 170 Q10 164 14 154 Q20 140 33 130 Z" fill="var(--chibi-hair2m)"/><path d="M97 130 Q112 134 116 150 Q120 162 118 170 Q120 164 116 154 Q110 140 97 130 Z" fill="var(--chibi-hair2m)"/><circle cx="12" cy="168" r="8" fill="var(--chibi-hair2d)"/><circle cx="118" cy="168" r="8" fill="var(--chibi-hair2d)"/><ellipse cx="54" cy="140" rx="6" ry="7" fill="var(--chibi-eye)"/><ellipse cx="76" cy="140" rx="6" ry="7" fill="var(--chibi-eye)"/><circle cx="52" cy="136" r="2.8" fill="#fff"/><circle cx="55.5" cy="141" r="1.3" fill="#fff"/><circle cx="74" cy="136" r="2.8" fill="#fff"/><circle cx="77.5" cy="141" r="1.3" fill="#fff"/><ellipse cx="45" cy="151" rx="8" ry="5" fill="var(--chibi-blush)" opacity="0.35"/><ellipse cx="85" cy="151" rx="8" ry="5" fill="var(--chibi-blush)" opacity="0.35"/><ellipse cx="66" cy="154" rx="3.5" ry="2.5" fill="var(--chibi-mouth)"/><path d="M46 170 Q42 180 38 192" fill="none" stroke="var(--chibi-skin)" stroke-width="10" stroke-linecap="round"/><path d="M84 170 Q88 180 92 192" fill="none" stroke="var(--chibi-skin)" stroke-width="10" stroke-linecap="round"/></svg>` }
  };

  function updateChibis(theme) {
    const set = CHIBI_SETS[theme] || CHIBI_SETS.sakura;
    const bar = document.getElementById('chibiBar');
    const sideL = document.getElementById('chibiSideL');
    const sideR = document.getElementById('chibiSideR');
    if (bar) bar.innerHTML = '<div class="chibi-mini">' + set.mL + '</div><div class="chibi-mini">' + set.mR + '</div>';
    if (sideL) sideL.innerHTML = '<div class="chibi-bounce">' + set.dL + '</div>';
    if (sideR) sideR.innerHTML = '<div class="chibi-bounce">' + set.dR + '</div>';
  }

  function updateDecorations(theme) {
    const sparkles = document.querySelectorAll('.bg-deco .sparkle');
    const emojis = SPARKLE_EMOJIS[theme] || SPARKLE_EMOJIS.sakura;
    sparkles.forEach((el, i) => { if (emojis[i]) el.textContent = emojis[i]; });
    const moon = document.getElementById('moonGlow');
    if (moon) moon.textContent = MOON_EMOJI[theme] || '🌙';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = META_COLORS[theme] || '#ff6b9d';
    updateChibis(theme);
  }

  /* ─── 动态流星 ─── */
  function spawnShootingStar() {
    const sf = document.getElementById('starfield');
    if (!sf) return;
    const star = document.createElement('div');
    star.className = 'shooting';
    const top = Math.random() * 60 + 5; // 5%-65% from top
    const left = Math.random() * 70; // 0%-70% from left
    const len = Math.random() * 50 + 40; // 40-90px length
    star.style.cssText = `top:${top}%;left:${left}%;width:${len}px;animation-duration:${Math.random()*1.2+1.2}s;animation-delay:0s`;
    sf.appendChild(star);
    star.addEventListener('animationend', () => star.remove());
  }
  function scheduleShootingStar() {
    const delay = Math.random() * 8000 + 4000; // 4-12s random interval
    setTimeout(() => { spawnShootingStar(); scheduleShootingStar(); }, delay);
  }
  scheduleShootingStar();

  function setTheme(name) {
    document.body.classList.remove('theme-starry', 'theme-aurora', 'theme-forest', 'theme-dark');
    if (name !== 'sakura') document.body.classList.add('theme-' + name);
    localStorage.setItem(THEME_KEY, name);
    themeSwitch.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.theme === name);
    });
    updateDecorations(name);
  }

  themeSwitch.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    setTheme(btn.dataset.theme);
  });

  // 恢复上次主题
  const savedTheme = localStorage.getItem(THEME_KEY) || 'sakura';
  setTheme(savedTheme);

  /* ─── Toast ─── */
  function toast(msg) {
    if (toastTimer) clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('visible');
    toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 1500);
  }

  /* ─── Render ─── */
  function render() {
    const items = filtered();
    const remaining = todos.filter(t => !t.done).length;
    const completed = todos.length - remaining;
    statsEl.textContent = `共 ${todos.length} 条 · ${remaining} 未完成`;

    // 没有已完成任务时隐藏清除按钮，避免被误认为空行
    clearBtn.style.visibility = completed > 0 ? 'visible' : 'hidden';

    if (items.length === 0) {
      const icons = { all: '🌸', active: '🎉', completed: '😴' };
      const msgs  = {
        all: '还没有任务哦～<br>快添加今天要做的事吧！',
        active: '全部完成啦！<br>你超棒的～ 🎉',
        completed: '还没有已完成的任务…<br>加油完成第一项吧！'
      };
      container.innerHTML = `<div class="empty-state">
        <div class="icon">${icons[filter]}</div>
        <div class="msg">${msgs[filter]}</div>
      </div>`;
      return;
    }

    const ul = document.createElement('ul');
    ul.className = 'todo-list';

    items.forEach(t => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (t.done ? ' completed' : '');
      li.dataset.id = t.id;

      // swipe bg
      const swipeBg = document.createElement('div');
      swipeBg.className = 'swipe-bg';
      swipeBg.textContent = '🗑️';

      // checkbox
      const cb = document.createElement('div');
      cb.className = 'checkbox';
      cb.dataset.action = 'toggle';

      // delete btn
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-delete';
      delBtn.dataset.action = 'delete';
      delBtn.textContent = '🗑️';

      // text or edit
      let contentEl;
      if (editingId === t.id) {
        contentEl = document.createElement('input');
        contentEl.className = 'edit-input';
        contentEl.value = t.text;
        contentEl.dataset.action = 'editInput';

        const catIconEdit = document.createElement('span');
        catIconEdit.className = 'todo-cat';
        catIconEdit.textContent = CAT_ICONS[t.cat] || '';

        li.appendChild(swipeBg);
        li.appendChild(catIconEdit);
        li.appendChild(cb);
        li.appendChild(contentEl);
        li.appendChild(delBtn);
      } else {
        // category icon
        const catIcon = document.createElement('span');
        catIcon.className = 'todo-cat';
        catIcon.textContent = CAT_ICONS[t.cat] || '';
        catIcon.dataset.action = 'edit';

        // text wrapper
        const textWrap = document.createElement('div');
        textWrap.style.cssText = 'flex:1;min-width:0;';

        contentEl = document.createElement('span');
        contentEl.className = 'todo-text';
        contentEl.textContent = t.text;
        contentEl.dataset.action = 'edit';
        textWrap.appendChild(contentEl);

        // 完成时间
        if (t.done && t.completedAt) {
          const timeEl = document.createElement('span');
          timeEl.className = 'todo-time';
          timeEl.textContent = formatTime(t.completedAt);
          textWrap.appendChild(timeEl);
        }

        li.appendChild(swipeBg);
        li.appendChild(catIcon);
        li.appendChild(cb);
        li.appendChild(textWrap);
        li.appendChild(delBtn);
      }

      ul.appendChild(li);
    });

    container.innerHTML = '';
    container.appendChild(ul);

    // auto-focus edit input
    if (editingId) {
      requestAnimationFrame(() => {
        const inp = container.querySelector('[data-action="editInput"]');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });
    }
  }

  /* ─── Actions ─── */
  function add(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    todos.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), text: trimmed, cat, done: false, completedAt: null });
    save(); render();
    input.value = '';
    input.focus();
  }

  function toggle(id) {
    const todo = todos.find(x => x.id === id);
    if (!todo) return;
    todo.done = !todo.done;
    // 记录完成时间 / 取消完成时清除时间
    todo.completedAt = todo.done ? new Date().toISOString() : null;
    save(); render();
    // pop animation
    requestAnimationFrame(() => {
      const el = container.querySelector(`[data-id="${id}"]`);
      if (el) { el.classList.add('popping'); el.addEventListener('animationend', () => el.classList.remove('popping'), {once:true}); }
    });
    if (todo.done) toast('✅ 任务完成！');
  }

  let undoData = null, undoTimer = null;

  function remove(id) {
    const idx = todos.findIndex(t => t.id === id);
    if (idx === -1) return;
    const wasEditing = editingId === id;
    // 保存快照以便撤销
    undoData = { item: { ...todos[idx] }, index: idx };
    todos.splice(idx, 1);
    if (wasEditing) editingId = null;
    save(); render();
    showUndoToast(id);
  }

  function undo(id) {
    if (!undoData) return;
    todos.splice(undoData.index, 0, undoData.item);
    undoData = null;
    if (undoTimer) clearTimeout(undoTimer);
    save(); render();
    toast('已恢复 ✅');
  }

  function showUndoToast(id) {
    if (undoTimer) clearTimeout(undoTimer);
    const el = document.getElementById('toast');
    el.innerHTML = '已删除 <button id="undoBtn" style="margin-left:8px;padding:4px 12px;border-radius:12px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;font-size:0.85rem">撤销</button>';
    el.classList.add('visible');
    document.getElementById('undoBtn').onclick = () => { undo(id); el.classList.remove('visible'); };
    undoTimer = setTimeout(() => { undoData = null; el.classList.remove('visible'); }, 4000);
  }

  function startEdit(id) {
    editingId = id;
    render();
  }

  function commitEdit(id, newText) {
    const todo = todos.find(x => x.id === id);
    if (todo) {
      const trim = newText.trim();
      if (trim) todo.text = trim;
    }
    editingId = null;
    save(); render();
  }

  function clearDone() {
    const before = todos.length;
    todos = todos.filter(t => !t.done);
    if (before === todos.length) { toast('没有已完成的任务哦～'); return; }
    editingId = null;
    save(); render();
    toast(`清除了 ${before - todos.length} 条 🧹`);
  }

  function setFilter(f) {
    filter = f;
    editingId = null;
    undoData = null;
    filterBtns.forEach(b => b.classList.toggle('active', b.dataset.filter === f));
    render();
  }

  /* ─── Swipe to delete ─── */
  let touchStartX = 0, touchStartY = 0, swipeTarget = null, swipeDx = 0;

  container.addEventListener('touchstart', e => {
    const item = e.target.closest('.todo-item');
    if (!item || editingId) { swipeTarget = null; return; }
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    swipeTarget = item;
    swipeDx = 0;
    swipeTarget.style.transition = 'none';
  }, { passive: true });

  container.addEventListener('touchmove', e => {
    if (!swipeTarget) return;
    const touch = e.touches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    // only left swipe (negative dx), horizontal dominant
    if (dx < -5 && Math.abs(dx) > Math.abs(dy) * 0.6) {
      swipeDx = Math.max(dx, -120); // clamp to -120px
      swipeTarget.style.transform = `translateX(${swipeDx}px)`;
      const bg = swipeTarget.querySelector('.swipe-bg');
      if (bg) {
        bg.style.width = `${Math.abs(swipeDx)}px`;
        bg.classList.add('show');
      }
    }
  }, { passive: true });

  container.addEventListener('touchend', e => {
    if (!swipeTarget) return;
    const target = swipeTarget;
    const id = target.dataset.id;
    const dx = swipeDx;
    swipeTarget = null;
    swipeDx = 0;
    document.querySelectorAll('.swipe-bg.show').forEach(b => { b.classList.remove('show'); b.style.width = ''; });
    if (dx < -40 && id) {
      target.style.transition = 'all 0.2s ease';
      target.style.transform = 'translateX(-120px)';
      target.style.opacity = '0';
      remove(id);
    } else {
      target.style.transition = 'all 0.25s ease';
      target.style.transform = '';
    }
  });

  /* ─── Click delegation ─── */
  container.addEventListener('click', e => {
    const btn  = e.target.closest('[data-action]');
    const item = e.target.closest('.todo-item');
    if (!btn || !item) return;
    if (editingId) return; // ignore clicks while editing
    const id = item.dataset.id;
    const action = btn.dataset.action;

    if (action === 'toggle')  toggle(id);
    if (action === 'delete')  remove(id);
    if (action === 'edit')    startEdit(id);
  });

  /* ─── Double-click to edit ─── */
  container.addEventListener('dblclick', e => {
    const textEl = e.target.closest('.todo-text');
    if (textEl && !editingId) {
      const item = textEl.closest('.todo-item');
      if (item) startEdit(item.dataset.id);
    }
  });

  /* ─── Edit input keyboard ─── */
  container.addEventListener('keydown', e => {
    if (e.target.dataset.action !== 'editInput') return;
    const item = e.target.closest('.todo-item');
    if (!item) return;
    if (e.key === 'Enter')  { e.preventDefault(); commitEdit(item.dataset.id, e.target.value); }
    if (e.key === 'Escape') { e.preventDefault(); editingId = null; render(); }
  });

  /* ─── Edit input blur ─── */
  container.addEventListener('blur', e => {
    if (e.target.dataset.action === 'editInput') {
      const item = e.target.closest('.todo-item');
      if (item) commitEdit(item.dataset.id, e.target.value);
    }
  }, true);

  /* ─── Add ─── */
  addBtn.addEventListener('click', () => add(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') add(input.value); });

  /* ─── Clear done ─── */
  clearBtn.addEventListener('click', clearDone);

  /* ─── Filters ─── */
  filterBtns.forEach(b => b.addEventListener('click', () => setFilter(b.dataset.filter)));

  /* ─── Category ─── */
  catBtns.forEach(b => b.addEventListener('click', () => {
    cat = b.dataset.cat;
    catBtns.forEach(x => x.classList.toggle('active', x.dataset.cat === cat));
    render();
  }));

  /* ─── Date ─── */
  (function updateDate() {
    dateEl.textContent = new Date().toLocaleDateString('zh-CN', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
  })();

  /* ─── PWA: Service Worker ─── */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=18').then(reg => {
        // SW registered
      }).catch(err => {
        // SW failed
      });
    });
  }

  /* ─── PWA: Install Prompt ─── */
  let deferredPrompt = null;
  const installBanner = document.getElementById('installBanner');
  const installBtn    = document.getElementById('installBtn');
  const bannerClose   = document.getElementById('bannerClose');
  const isStandalone  = window.matchMedia('(display-mode: standalone)').matches
                     || navigator.standalone
                     || window.matchMedia('(display-mode: fullscreen)').matches;

  // 监听 beforeinstallprompt（Android Chrome 等）
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    // 非独立窗口模式时显示安装横幅
    if (!isStandalone) {
      installBanner.classList.remove('hidden');
    }
  });

  // 用户点击「安装」
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) {
      // 降级：iOS 或其他不支持 beforeinstallprompt 的情况
      showIOSGuide();
      return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    // Install attempted
    deferredPrompt = null;
    installBanner.classList.add('hidden');
  });

  // 关闭横幅
  bannerClose.addEventListener('click', () => {
    installBanner.classList.add('hidden');
  });

  // 已安装后隐藏横幅
  window.addEventListener('appinstalled', () => {
    installBanner.classList.add('hidden');
    deferredPrompt = null;
    toast('🎉 安装成功！');
  });

  // iOS 引导提示
  function showIOSGuide() {
    const isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
    if (isIOS) {
      toast('🍎 点 Safari 底部「分享」→「添加到主屏幕」');
    } else {
      toast('📲 点浏览器菜单 →「添加到主屏幕」');
    }
    installBanner.classList.add('hidden');
  }

  // 如果在独立模式中，不显示横幅
  if (isStandalone) {
    installBanner.classList.add('hidden');
  }

  // 如果是不支持 beforeinstallprompt 且不是独立模式的 iOS，3秒后显示引导
  if (!isStandalone && /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase())) {
    setTimeout(() => {
      if (!deferredPrompt) {
        installBanner.classList.remove('hidden');
        installBanner.querySelector('.banner-text').innerHTML =
          '<strong>添加到主屏幕</strong><br>像 App 一样快速打开';
        installBtn.textContent = '📘 教程';
      }
    }, 3000);
  }

  /* ─── Init ─── */
  migrateData(); // 合并旧版本数据（仅执行一次）
  todos = load();
  migrate(); // 给老数据补上完成时间
  render();
  input.focus();
})();
</script>
</body>
</html>
